<tr><td><span class="d" style="background:var(--text-strong)"></span><code>--text-strong</code></td><td>Headlines, numerals</td><td><span class="d" style="background:var(--action-primary)"></span><code>--action-primary</code></td><td>Buttons, links</td></tr>

<tr><td><span class="d" style="background:var(--border-subtle)"></span><code>--border-subtle</code></td><td>Card hairlines</td><td><span class="d" style="background:var(--surface-brand-soft)"></span><code>--surface-brand-soft</code></td><td>Badge fills</td></tr>
</table></body></html>
