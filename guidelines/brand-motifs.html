<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--surface-page);font-family:var(--font-body)}.r{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.b{height:96px;border-radius:10px;overflow:hidden;position:relative;background:var(--ink-50);border:1px solid var(--border-subtle)}.l{font-family:var(--font-mono);font-size:10px;color:var(--ink-500);margin-top:7px}</style></head><body>
<div class="r">
<div><div class="b"><div style="position:absolute;inset:auto -20% 14% -20%;height:42px;background:var(--gradient-brand-band);transform:rotate(-7deg)"></div></div><div class="l">Angled gradient band</div></div>
<div><div class="b"><div style="position:absolute;top:-30px;right:-20px;width:120px;height:120px;background:var(--gradient-brand);clip-path:polygon(0 0,100% 0,100% 100%,50% 62%,0 100%)"></div></div><div class="l">Corner chevron</div></div>
<div><div class="b" style="background:#fff"><div style="position:absolute;inset:0 0 auto 0;height:4px;background:var(--gradient-brand)"></div></div><div class="l">4px gradient rule</div></div>
<div><div class="b" style="background:var(--gradient-brand-band);display:flex;align-items:center;justify-content:center"><span style="color:rgba(255,255,255,.32);font-family:var(--font-display);font-weight:800;font-size:13px;text-align:center;line-height:1.35">Do The Most • Drive • Results</span></div><div class="l">Ghosted word wall</div></div>
</div></body></html>
